services:
  db:
    image: mysql:8.0
    container_name: mikrobackup-db
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mikrobackup_db_data:/var/lib/mysql

    # no expose MySQL ke host
    # ports:
    #   - "3306:3306"

    networks:
      - mikrobackup-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    container_name: mikrobackup-app
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8500:5000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FLASK_ENV: ${FLASK_ENV:-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
      - mikrobackup_migrations:/app/migrations

    depends_on:
      db:
        condition: service_healthy

    networks:
      - mikrobackup-net

volumes:
  mikrobackup_db_data:
    name: mikrobackup_db_data
  
  mikrobackup_migrations:
    name: mikrobackup_migrations

networks:
  mikrobackup-net:
    name: mikrobackup-net
    driver: bridge