version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mikrobackup-db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mikrobackup}
      MYSQL_USER: ${MYSQL_USER:-mikrobackup_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-passwordkuat}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_sangat_kuat}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      timeout: 10s
      retries: 5

  web:
    build: .
    container_name: mikrobackup-app
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      FLASK_ENV: ${FLASK_ENV:-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./backups:/app/backups
      - ./logs:/app/logs
    depends_on:
      - db

volumes:
  db_data:
