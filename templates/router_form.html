{% extends 'base.html' %}
{% block title %}{{ 'Edit' if is_edit else 'Add' }} Router{% endblock %}
{% block page_title %}{{ 'Edit' if is_edit else 'Add' }} Router{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 shadow-sm p-6 lg:p-8">
    <form method="POST" id="router-form" data-is-edit="{{ 'true' if is_edit else 'false' }}" data-api-test-url="{{ url_for('api_test_inline') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="space-y-5">
        <div>
          <label class="form-label">Router Name</label>
          <input type="text" name="name" required maxlength="100"
            value="{{ router.name if router else '' }}"
            class="form-input" placeholder="Core-RTR-01">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
          <div class="sm:col-span-2">
            <label class="form-label">Host (IP or Hostname)</label>
            <input type="text" name="host" required maxlength="253"
              value="{{ router.host if router else '' }}"
              class="form-input" placeholder="192.168.88.1">
          </div>
          <div>
            <label class="form-label">SSH Port</label>
            <input type="number" name="port" required min="1" max="65535"
              value="{{ router.port if router else 22 }}" class="form-input">
          </div>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="form-label">Username</label>
            <input type="text" name="username" required maxlength="50"
              value="{{ router.username if router else '' }}"
              class="form-input" placeholder="admin">
          </div>
          <div>
            <label class="form-label">Auth Method</label>
            <select name="auth_method" id="auth_method" class="form-input">
              <option value="password" {{ 'selected' if router and router.auth_method == 'password' else '' }}>Password</option>
              <option value="key" {{ 'selected' if router and router.auth_method == 'key' else '' }}>SSH Key</option>
            </select>
          </div>
        </div>
        <div id="password-field">
          <label class="form-label">Password {{ '(leave blank to keep current)' if is_edit else '' }}</label>
          <input type="password" id="password" name="password" {{ 'required' if not is_edit else '' }}
            class="form-input" placeholder="••••••••">
        </div>
        <div id="key-field" class="hidden">
          <label class="form-label">SSH Private Key {{ '(leave blank to keep current)' if is_edit else '' }}</label>
          <textarea id="ssh_key" name="ssh_key" rows="6" {{ 'required' if not is_edit else '' }}
            class="form-input font-mono text-xs"
            placeholder="-----BEGIN OPENSSH PRIVATE KEY-----&#10;...&#10;-----END OPENSSH PRIVATE KEY-----">{{ router.ssh_key if router and router.ssh_key else '' }}</textarea>
        </div>
        <div>
          <label class="form-label">Tags <span class="text-gray-400">(optional)</span></label>
          <input type="text" name="tags" maxlength="200"
            value="{{ router.tags if router else '' }}"
            class="form-input" placeholder="core, datacenter-a">
        </div>
        <div>
          <label class="form-label">Notes <span class="text-gray-400">(optional)</span></label>
          <textarea name="notes" rows="3" maxlength="2000"
            class="form-input">{{ router.notes if router else '' }}</textarea>
        </div>
        <label class="flex items-center space-x-2">
          <input type="checkbox" name="enabled" {{ 'checked' if (router is none or router.enabled) else '' }}
            class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
          <span class="text-sm">Enabled</span>
        </label>
      </div>
      <div class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between mt-8 pt-5 border-t border-gray-200 dark:border-gray-700 gap-3">
        <div>
          <button type="button" id="test-btn"
            class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 text-sm font-semibold rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition">
            Test Connection
          </button>
        </div>
        <div class="flex items-center space-x-3">
          <a href="{{ url_for('routers') }}" class="px-4 py-2 text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-100">Cancel</a>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition shadow-sm">
            {{ 'Save Changes' if is_edit else 'Add Router' }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/router_form.js') }}"></script>
{% endblock %}
